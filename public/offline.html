<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0b3d2e">
  <title>Sem conexão · Norte Gestão</title>
  <style>
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px;
           background: #0b3d2e; color: #fff; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; text-align: center; }
    .card { max-width: 360px; }
    img { width: 72px; height: 72px; background: #f5f7f7; border-radius: 18px; padding: 12px; box-sizing: border-box; }
    h1 { font-size: 22px; margin: 20px 0 8px; }
    p { margin: 0 0 24px; line-height: 1.5; color: #d6e6dd; }
    button { background: #a8d83b; color: #0b3d2e; border: 0; border-radius: 12px; padding: 14px 24px; font-size: 16px; font-weight: 700; }
  </style>
</head>
<body>
  <div class="card">
    <img src="/brand/n-mark.png" alt="">
    <h1>Sem conexão</h1>
    <p>Não foi possível carregar o sistema. Assim que o sinal voltar, é só tentar de novo.</p>
    <button onclick="location.reload()">Tentar de novo</button>
  </div>
</body>
</html>
